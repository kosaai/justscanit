name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA (iphoneos, arm64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight checks
        run: |
          set -euo pipefail
          echo "===== HOST ====="
          sw_vers
          echo "===== XCODE ====="
          xcodebuild -version
          xcode-select -p
          echo "===== SWIFT ====="
          swift --version
          echo "===== SDKS ====="
          xcodebuild -showsdks
          echo "===== PROJECT SCHEMES ====="
          xcodebuild -list -project ScannerApp.xcodeproj
          echo "===== RELEASE BUILD SETTINGS ====="
          xcodebuild -project ScannerApp.xcodeproj -scheme ScannerApp -configuration Release -sdk iphoneos -showBuildSettings \
            | grep -E '^[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION|SDKROOT|ARCHS|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|TARGETED_DEVICE_FAMILY|MARKETING_VERSION|CURRENT_PROJECT_VERSION)[[:space:]]*='
          echo "===== DESTINATIONS ====="
          xcodebuild -project ScannerApp.xcodeproj -scheme ScannerApp -configuration Release -showdestinations | head -30

      - name: Build Release for iphoneos (arm64, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ScannerApp.xcodeproj \
            -scheme ScannerApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SUPPORTS_MACCATALYST=NO

          APP="build/Build/Products/Release-iphoneos/ScannerApp.app"
          echo "===== BUILT APP ====="
          ls -la "$APP"
          echo "===== BINARY TYPE ====="
          file "$APP/ScannerApp"
          lipo -info "$APP/ScannerApp"

      - name: Package JustScanIt-Original-Unsigned.ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ScannerApp.app"
          rm -rf Payload JustScanIt-Original-Unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -q -r JustScanIt-Original-Unsigned.ipa Payload
          echo "===== IPA ====="
          ls -la JustScanIt-Original-Unsigned.ipa
          echo "===== IPA CONTENTS (top) ====="
          unzip -l JustScanIt-Original-Unsigned.ipa | head -20
          echo "===== INFO.PLIST ====="
          plutil -p Payload/ScannerApp.app/Info.plist \
            | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|CFBundleExecutable|MinimumOSVersion|DTPlatformVersion|CFBundleDisplayName'
          echo "===== BINARY ARCH ====="
          lipo -info Payload/ScannerApp.app/ScannerApp
          echo "===== CODE SIGNATURE ====="
          codesign -dv Payload/ScannerApp.app 2>&1 | head -10 || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustScanIt-Original-Unsigned
          path: JustScanIt-Original-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
